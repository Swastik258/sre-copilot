name: sre-copilot

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sre_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-sre_copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    shm_size: "256mb"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  backend:
    image: ${BACKEND_IMAGE:-sre-copilot-backend:local}
    build:
      context: ../backend
      args:
        APP_VERSION: ${APP_VERSION:-0.2.0}
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-sre_copilot}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-sre_copilot}}
      # Compose migrates via the container command; do not auto-create schema.
      AUTO_CREATE_SCHEMA: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ALLOW_CREDENTIALS: ${ALLOW_CREDENTIALS:-true}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-0}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-default}
      SECURITY_HEADERS_ENABLED: ${SECURITY_HEADERS_ENABLED:-true}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-2000000}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-0}
      IDEMPOTENCY_TTL_HOURS: ${IDEMPOTENCY_TTL_HOURS:-24}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-false}
      ACCESS_LOG_ENABLED: ${ACCESS_LOG_ENABLED:-true}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}
      METRICS_ALLOW_UNAUTHENTICATED: ${METRICS_ALLOW_UNAUTHENTICATED:-false}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-sre-copilot-api}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_TRACES_SAMPLE_RATIO: ${OTEL_TRACES_SAMPLE_RATIO:-0.1}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
      EMAIL_DELIVERY: ${EMAIL_DELIVERY:-disabled}
      EMAIL_FROM: ${EMAIL_FROM:-SRE Copilot <no-reply@localhost>}
      EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED:-false}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      BACKGROUND_JOBS_ENABLED: ${BACKGROUND_JOBS_ENABLED:-false}
      BACKGROUND_JOB_POLL_SECONDS: ${BACKGROUND_JOB_POLL_SECONDS:-5}
      BACKGROUND_JOB_MAX_ATTEMPTS: ${BACKGROUND_JOB_MAX_ATTEMPTS:-5}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      BILLING_ENABLED: ${BILLING_ENABLED:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_TEAM: ${STRIPE_PRICE_TEAM:-}
      OAUTH_REDIRECT_BASE_URL: ${OAUTH_REDIRECT_BASE_URL:-http://localhost:8000}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-1500}
      AI_PRIVACY_MODE: ${AI_PRIVACY_MODE:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_HTTP_REFERER: ${OPENROUTER_HTTP_REFERER:-http://localhost:3000}
      OPENROUTER_APP_TITLE: ${OPENROUTER_APP_TITLE:-SRE Copilot}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      GITHUB_ENABLED: ${GITHUB_ENABLED:-false}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      GITHUB_REQUEST_TIMEOUT_SECONDS: ${GITHUB_REQUEST_TIMEOUT_SECONDS:-15}
      KUBERNETES_ENABLED: ${KUBERNETES_ENABLED:-false}
      KUBERNETES_DEMO_MODE: ${KUBERNETES_DEMO_MODE:-true}
      KUBERNETES_CLUSTERS: ${KUBERNETES_CLUSTERS:-}
      KUBERNETES_KUBECONFIG: ${KUBERNETES_KUBECONFIG:-}
      KUBERNETES_CONTEXT: ${KUBERNETES_CONTEXT:-}
      KUBERNETES_IN_CLUSTER: ${KUBERNETES_IN_CLUSTER:-false}
      KUBERNETES_REQUEST_TIMEOUT_SECONDS: ${KUBERNETES_REQUEST_TIMEOUT_SECONDS:-15}
      PROMETHEUS_ENABLED: ${PROMETHEUS_ENABLED:-false}
      PROMETHEUS_DEMO_MODE: ${PROMETHEUS_DEMO_MODE:-true}
      PROMETHEUS_URL: ${PROMETHEUS_URL:-}
      PROMETHEUS_REQUEST_TIMEOUT_SECONDS: ${PROMETHEUS_REQUEST_TIMEOUT_SECONDS:-15}
      REDACTION_ENABLED: ${REDACTION_ENABLED:-true}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 45s
    logging: *default-logging

  frontend:
    image: ${FRONTEND_IMAGE:-sre-copilot-frontend:local}
    build:
      context: ../frontend
      args:
        # Bake the API URL into the client bundle at build time.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    stop_grace_period: 30s
    logging: *default-logging

volumes:
  postgres_data:
