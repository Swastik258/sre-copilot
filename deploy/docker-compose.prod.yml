name: sre-copilot

# Single-host production app stack. PostgreSQL is intentionally external
# (managed service or a separately operated database). For a local database,
# use deploy/docker-compose.yml or the Helm chart with an external managed DB.
#
# Usage:
#   cp deploy/production.env.example deploy/production.env
#   chmod 600 deploy/production.env
#   docker compose --env-file deploy/production.env \
#     -f deploy/docker-compose.prod.yml up -d

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to an immutable image digest or version}
    pull_policy: always
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - path: ./production.env
        required: true
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      AUTH_REQUIRED: "true"
      AUTO_CREATE_SCHEMA: "false"
      LOG_JSON: "true"
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-10}
      METRICS_ENABLED: "true"
      BILLING_ENABLED: "false"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    stop_grace_period: 45s
    mem_limit: ${BACKEND_MEMORY_LIMIT:-1g}
    logging: *default-logging

  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE to an immutable image digest or version}
    pull_policy: always
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    stop_grace_period: 30s
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-512m}
    logging: *default-logging
