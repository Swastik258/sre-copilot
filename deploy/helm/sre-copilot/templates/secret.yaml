{{- if .Values.backend.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sre-copilot.secretName" . }}
  labels:
    {{- include "sre-copilot.labels" . | nindent 4 }}
  annotations:
    # Demo-only secret creation must exist before the pre-install migration Job.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  {{- range $key, $value := .Values.backend.secret }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
