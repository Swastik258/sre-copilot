name: Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Protected GitHub environment"
        required: true
        default: production
        type: choice
        options:
          - staging
          - production
      release:
        description: "Helm release name"
        required: true
        default: sre-copilot
        type: string
      namespace:
        description: "Kubernetes namespace"
        required: true
        default: sre-copilot
        type: string
      revision:
        description: "Helm revision to restore; 0 means the previous release"
        required: true
        default: "0"
        type: string
      confirmation:
        description: "Type ROLLBACK to confirm"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  rollback:
    name: Rollback ${{ inputs.release }} in ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          RELEASE: ${{ inputs.release }}
          NAMESPACE: ${{ inputs.namespace }}
          REVISION: ${{ inputs.revision }}
        run: |
          set -eu
          if [ "$CONFIRMATION" != "ROLLBACK" ]; then
            echo "Set confirmation to ROLLBACK." >&2
            exit 1
          fi
          for value in "$RELEASE" "$NAMESPACE"; do
            if ! printf '%s' "$value" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'; then
              echo "Invalid release or namespace: $value" >&2
              exit 1
            fi
          done
          case "$REVISION" in
            ''|*[!0-9]*) echo "revision must be a non-negative integer." >&2; exit 1 ;;
          esac

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure cluster access
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          set -eu
          if [ -z "$KUBE_CONFIG_B64" ]; then
            echo "KUBE_CONFIG_B64 is not configured for this environment." >&2
            exit 1
          fi
          install -d -m 700 "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Show history
        env:
          RELEASE: ${{ inputs.release }}
          NAMESPACE: ${{ inputs.namespace }}
        run: helm -n "$NAMESPACE" history "$RELEASE"

      - name: Helm rollback
        env:
          RELEASE: ${{ inputs.release }}
          NAMESPACE: ${{ inputs.namespace }}
          REVISION: ${{ inputs.revision }}
        run: |
          helm -n "$NAMESPACE" rollback "$RELEASE" "$REVISION" \
            --wait \
            --cleanup-on-fail \
            --timeout 15m

      - name: Verify rollout and readiness
        env:
          APP_URL: ${{ vars.APP_URL }}
          RELEASE: ${{ inputs.release }}
          NAMESPACE: ${{ inputs.namespace }}
        run: |
          set -eu
          for component in backend frontend; do
            kubectl -n "$NAMESPACE" get deployment \
              -l "app.kubernetes.io/instance=$RELEASE,app.kubernetes.io/component=$component" \
              -o name | while read -r deployment; do
                kubectl -n "$NAMESPACE" rollout status "$deployment" --timeout=300s
              done
          done
          for attempt in $(seq 1 20); do
            if curl -fsS "${APP_URL%/}/api/v1/health/ready" >/dev/null; then
              echo "Rollback readiness check passed."
              exit 0
            fi
            sleep 3
          done
          echo "Rollback readiness check failed." >&2
          exit 1

      - name: Rollback summary
        env:
          RELEASE: ${{ inputs.release }}
          NAMESPACE: ${{ inputs.namespace }}
          REVISION: ${{ inputs.revision }}
        run: |
          {
            echo "### Rolled back ${RELEASE} in ${NAMESPACE}"
            echo ""
            echo "- Requested revision: \`${REVISION}\`"
            echo "- Database migrations are forward-only. Review schema compatibility before and after rollback."
          } >> "$GITHUB_STEP_SUMMARY"
