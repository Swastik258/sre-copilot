name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Type check (mypy)
        run: mypy app
      - name: Tests with coverage
        # Tests use SQLite + fixtures; no production credentials required.
        run: pytest --cov=app --cov-branch --cov-report=term --cov-fail-under=80
      - name: Security scan (bandit)
        run: bandit -q -c pyproject.toml -r app
      - name: Dependency audit (pip-audit)
        run: pip-audit --progress-spinner off

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build
      - name: Release route smoke
        run: |
          npm run start > /tmp/sre-copilot-frontend.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000/ > /dev/null; then
              break
            fi
            sleep 2
          done
          RELEASE_BASE_URL=http://localhost:3000 npm run smoke
