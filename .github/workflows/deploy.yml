name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Protected GitHub environment"
        required: true
        default: production
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: "Image tag from the Release workflow"
        required: true
        type: string
      release:
        description: "Helm release name"
        required: true
        default: sre-copilot
        type: string
      namespace:
        description: "Kubernetes namespace"
        required: true
        default: sre-copilot
        type: string
      confirmation:
        description: "Type DEPLOY to confirm"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.image_tag }} to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          RELEASE: ${{ inputs.release }}
          NAMESPACE: ${{ inputs.namespace }}
        run: |
          set -eu
          if [ "$CONFIRMATION" != "DEPLOY" ]; then
            echo "Set confirmation to DEPLOY." >&2
            exit 1
          fi
          for value in "$IMAGE_TAG" "$RELEASE" "$NAMESPACE"; do
            if ! printf '%s' "$value" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'; then
              echo "Invalid release, namespace, or image tag: $value" >&2
              exit 1
            fi
          done

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure cluster access
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          set -eu
          if [ -z "$KUBE_CONFIG_B64" ]; then
            echo "KUBE_CONFIG_B64 is not configured for this environment." >&2
            exit 1
          fi
          install -d -m 700 "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl version --client
          kubectl cluster-info

      - name: Verify deployment prerequisites
        env:
          APP_URL: ${{ vars.APP_URL }}
          INGRESS_HOST: ${{ vars.INGRESS_HOST }}
          SECRET_NAME: ${{ vars.APP_SECRET_NAME }}
          NAMESPACE: ${{ inputs.namespace }}
        run: |
          set -eu
          for value in "$APP_URL" "$INGRESS_HOST" "$SECRET_NAME"; do
            if [ -z "$value" ]; then
              echo "APP_URL, INGRESS_HOST, and APP_SECRET_NAME must be set as environment variables." >&2
              exit 1
            fi
          done
          case "$APP_URL" in
            https://*) ;;
            *) echo "APP_URL must use HTTPS in a deployed environment." >&2; exit 1 ;;
          esac
          if ! kubectl -n "$NAMESPACE" get secret "$SECRET_NAME" >/dev/null 2>&1; then
            echo "Secret $SECRET_NAME was not found in namespace $NAMESPACE." >&2
            exit 1
          fi

      - name: Helm upgrade
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          RELEASE: ${{ inputs.release }}
          NAMESPACE: ${{ inputs.namespace }}
          APP_URL: ${{ vars.APP_URL }}
          INGRESS_HOST: ${{ vars.INGRESS_HOST }}
          INGRESS_CLASS: ${{ vars.INGRESS_CLASS }}
          TLS_SECRET_NAME: ${{ vars.TLS_SECRET_NAME }}
          SECRET_NAME: ${{ vars.APP_SECRET_NAME }}
          TRUSTED_PROXY_IPS: ${{ vars.TRUSTED_PROXY_IPS }}
        run: |
          set -eu
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          extra=()
          if [ -n "${TLS_SECRET_NAME:-}" ]; then
            extra+=(--set ingress.tls.enabled=true --set-string "ingress.tls.secretName=$TLS_SECRET_NAME")
          fi
          helm upgrade --install "$RELEASE" deploy/helm/sre-copilot \
            --namespace "$NAMESPACE" \
            --create-namespace \
            --set-string "backend.image.repository=ghcr.io/${owner}/sre-copilot-backend" \
            --set-string "frontend.image.repository=ghcr.io/${owner}/sre-copilot-frontend" \
            --set-string "backend.image.tag=$IMAGE_TAG" \
            --set-string "frontend.image.tag=$IMAGE_TAG" \
            --set-string "backend.existingSecret=$SECRET_NAME" \
            --set ingress.enabled=true \
            --set-string "ingress.className=${INGRESS_CLASS:-nginx}" \
            --set-string "ingress.host=$INGRESS_HOST" \
            --set-string "backend.env.CORS_ORIGINS=$APP_URL" \
            --set-string "backend.env.APP_BASE_URL=$APP_URL" \
            --set-string "backend.env.OAUTH_REDIRECT_BASE_URL=$APP_URL" \
            --set-string "backend.env.TRUSTED_PROXY_IPS=${TRUSTED_PROXY_IPS:-}" \
            "${extra[@]}" \
            --wait \
            --atomic \
            --cleanup-on-fail \
            --timeout 15m

      - name: Verify rollout and readiness
        env:
          APP_URL: ${{ vars.APP_URL }}
          RELEASE: ${{ inputs.release }}
          NAMESPACE: ${{ inputs.namespace }}
        run: |
          set -eu
          for component in backend frontend; do
            kubectl -n "$NAMESPACE" get deployment \
              -l "app.kubernetes.io/instance=$RELEASE,app.kubernetes.io/component=$component" \
              -o name | while read -r deployment; do
                kubectl -n "$NAMESPACE" rollout status "$deployment" --timeout=300s
              done
          done
          for attempt in $(seq 1 20); do
            if curl -fsS "${APP_URL%/}/api/v1/health/ready" >/dev/null; then
              echo "Readiness endpoint passed."
              exit 0
            fi
            sleep 3
          done
          echo "Readiness endpoint did not pass." >&2
          exit 1

      - name: Deployment summary
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          RELEASE: ${{ inputs.release }}
          NAMESPACE: ${{ inputs.namespace }}
        run: |
          {
            echo "### Deployed ${RELEASE} to ${NAMESPACE}"
            echo ""
            echo "- Image tag: \`${IMAGE_TAG}\`"
            echo "- Helm revision: \`$(helm -n "$NAMESPACE" history "$RELEASE" --max 1 --output json | tr -d '\n')\`"
            echo "- Rollback: run the Rollback workflow for this release."
          } >> "$GITHUB_STEP_SUMMARY"
