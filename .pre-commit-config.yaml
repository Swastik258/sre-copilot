# Install once with: pip install -e "backend[dev]" && pre-commit install
# Run manually with: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
        exclude: ^backend/tests/unit/test_redaction\.py$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^backend/.*\.py$
      - id: ruff-format
        files: ^backend/.*\.py$

  - repo: local
    hooks:
      - id: backend-mypy
        name: backend type check (mypy)
        entry: sh -c 'cd backend && python -m mypy app'
        language: system
        pass_filenames: false
        files: ^backend/app/.*\.py$
      - id: backend-bandit
        name: backend security scan (bandit)
        entry: sh -c 'cd backend && python -m bandit -q -c pyproject.toml -r app'
        language: system
        pass_filenames: false
        files: ^backend/app/.*\.py$
