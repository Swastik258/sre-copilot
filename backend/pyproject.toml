[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sre-copilot-backend"
version = "0.2.0"
description = "Backend API for SRE Copilot"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.110,<1",
    "pydantic-settings>=2.2,<3",
    "psycopg[binary]>=3.1,<4",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "ruff>=0.6",
]
# Optional: required only for live Kubernetes diagnosis (fixture/demo mode and
# the test suite do not need it, because the client import is lazy).
kubernetes = [
    "kubernetes>=29,<34",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
