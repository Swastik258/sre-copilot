[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sre-copilot-backend"
version = "0.2.0"
description = "Backend API for SRE Copilot"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "argon2-cffi>=23,<26",
    "cryptography>=42,<51",
    "fastapi>=0.110,<1",
    "pydantic-settings>=2.2,<3",
    "psycopg[binary]>=3.1,<4",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
dev = [
    "bandit[toml]>=1.7,<2",
    "httpx>=0.27,<1",
    "mypy>=1.10,<2",
    "pip-audit>=2.7,<3",
    "pre-commit>=3.7,<5",
    "pytest>=9,<10",
    "pytest-cov>=5,<7",
    "ruff>=0.6",
]
# Optional: required only for live Kubernetes diagnosis (fixture/demo mode and
# the test suite do not need it, because the client import is lazy).
kubernetes = [
    "kubernetes>=29,<34",
]
# Optional production telemetry. The app emits OpenTelemetry spans through the
# API even without the SDK; exporters and error tracking need these packages.
observability = [
    "opentelemetry-sdk>=1.25,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.25,<2",
    "sentry-sdk[fastapi]>=2,<3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 80
precision = 1
show_missing = true
skip_covered = true

[tool.mypy]
files = ["app"]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "alembic", ".venv"]
